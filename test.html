<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Search</title>
    <link rel="stylesheet" href="styles.css">

         <!-- FOR BOOTSTRAP & FONT AWESOME ICONS  -->
         <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
         <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
         <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
     
    <style>
        
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: beige;
            margin: 0;
            padding: 1%;
        }

        h1 {
            color: #ff6347;
        }

        form {
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            border: 2px solid #ff6347;
            border-radius: 5px;
            margin-right: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #ff6347;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff4500;
        }

        #pokemon-details {
            margin-top: 20px;
            font-size: 1.2em;
        }

        ul.no-bullets {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        h3{
            color: maroon;
        }

        hr{
            border-color: maroon;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="col-sm-12">
        <div class="row">
            <div class="col-sm-12">
                <h1 style="text-align: center; color: goldenrod;"><i class="fa fa-star" aria-hidden="true"></i> Pokédex <i class="fa fa-star" aria-hidden="true"></i></h1>
            </div>
            <p style="padding-bottom: 6%;"></p>
            <hr>
            <div class="col-sm-12">
                <div class="row">
                    <div class="col-sm-4">
                        <h3 style="text-align: left;"><i class="fa fa-search" aria-hidden="true"></i> Search Pokemon:</h3>
                        <input type="text" id="search-bar" class="form-control" placeholder="Search Pokémon...">
                    </div>
                    <div class="col-sm-4">
                        <h3 style="text-align: left;"><i class="fa fa-filter" aria-hidden="true"></i> Filter by Type:</h3>
                        <form>
                            <select id="element-filter" class="form-control">
                                <option value="all">All Types</option>
                                <option value="Normal">Normal</option>
                                <option value="Bug">Bug</option>
                                <option value="Fire">Fire</option>
                                <option value="Water">Water</option>
                                <option value="Grass">Grass</option>
                                <option value="Electric">Electric</option>
                                <option value="Flying">Flying</option>
                                <option value="Psychic">Psychic</option>
                                <option value="Rock">Rock</option>
                                <option value="Ground">Ground</option>
                            </select>
                        </form>
                    </div>
                    <div class="col-sm-4">
                        <h3 style="text-align: left;"><i class="fa fa-filter" aria-hidden="true"></i> Filter by Generation:</h3>
                        <form id="filter-form">
                            <select id="generation-filter" class="form-control">
                                <option value="1">Generation 1</option>
                                <option value="2">Generation 2</option>
                            </select>
                        </form>
                    </div>
                </div>
            </div>
            <p style="padding-bottom: 10%;"></p>
            <div class="col-sm-12" style="padding-left: 15%;">
                <div class="row">
                    <center>
                        <ul class="no-bullets" id="pokemon-list"></ul>
                    </center>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
<script src="script.js"></script>
</html>
